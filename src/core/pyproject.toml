[project]
name = "idr-core"
version = "0.1.0"
description = "共享核心：与领域无关的知识图谱 RAG 流水线"
requires-python = ">=3.12,<3.14"
dependencies = [
    "neo4j>=5.26",
    "openai>=1.60",
    "pdfplumber>=0.11",
    "psycopg[binary]>=3.2",
    "pydantic>=2.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
