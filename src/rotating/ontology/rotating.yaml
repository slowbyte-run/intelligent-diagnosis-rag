# 旋转设备故障诊断本体
#
# 用途：抽取阶段的受控词表与入库校验标准。清单外的新类型不得直接入库，
# 只能进入待审队列（见 AGENTS.md 第 5 条约束）。
#
# 建模原则（见 ADR-0004）：
#   1. 故障模式按「位置 × 损伤形式」建模。位置决定特征频率，损伤形式对齐标准。
#   2. 只列文献中真实出现过的组合，不做笛卡尔展开。
#   3. 无标准可依的类别（转子、结构）自建，并如实标注 source: 自建。
#   4. ISO 标准为付费版权文本：只借用术语与条款号，不复制其表格结构。

version: 0.1.0
domain: rotating
updated: 2026-11-10

standards:
  - id: ISO 15243:2017
    title: 滚动轴承 损伤和失效 术语、特征和原因
    usage: damage_form 词表来源（六大类），引用条款号
    modeling: 基于外观的损伤机理分类，不区分位置；位置维度由本项目补充
  - id: ISO 10825-1:2022
    title: 齿轮 齿的磨损和损伤 术语
    usage: 齿轮 damage_form 词表来源
  - id: IEC TS 60034-24:2009
    title: 旋转电机 在线检测与诊断
    usage: 电气类故障模式来源
  - id: ISO 20816-1:2026
    title: 机械振动 振动评定（取代 ISO 10816-1:1995）
    usage: 振动烈度评定方法；**不含故障模式分类**，不作为词表
  - id: ISO 13373-3:2015
    title: 状态监测与诊断 振动诊断
    usage: 诊断流程与数据获取；**不含分类体系**，不作为词表
  - id: ISO 13374-1:2003
    title: 状态监测与诊断 数据处理、通信与表示
    usage: 参考架构 DA→DM→SD→HA→PA→AG，对应本项目的流水线分层

# ---------------------------------------------------------------------------

entity_types:
  equipment_class:
    label: 设备类别
    description: 顶层设备分类，通过 has_component 展开部件
    aliases: [设备类型, 装备类别]
    external_code: null

  component:
    label: 部件
    description: 设备中可独立评估故障状态的最小机械单元
    aliases: [零件, 组件, 构件]
    external_code: null

  fault_mode:
    label: 故障模式
    description: 能对应一组特征征兆的故障单元，属性见 location 与 damage_form
    aliases: [故障形式, 失效形式, 损伤形式, 缺陷形式]
    attributes:
      location: 发生部位，取值见 locations
      damage_form: 损伤形式，取值见 damage_forms
    external_code: null

  fault_cause:
    label: 故障原因
    description: 导致故障模式形成的因素
    aliases: [诱因, 成因, 起因]
    external_code: null

  symptom:
    label: 征兆
    description: 可由传感器或人工巡检直接观测到的量或现象；只存最具体的一层
    aliases: [症状, 表征, 表现, 现象]
    external_code: null

  detection_method:
    label: 检测手段
    description: 用于确认某个故障模式的方法或试验
    aliases: [检测方法, 诊断手段, 测试方法, 检查方法]
    external_code: null

  evidence:
    label: 证据段
    description: 文献原文段落及其定位信息，是引用回溯的最小单位
    aliases: []
    attributes:
      doc_id: 文献标识
      page: 页码
      bbox: 版面坐标
      charspan: 字符区间
    external_code: null

# ---------------------------------------------------------------------------

locations:
  outer_race: 外圈
  inner_race: 内圈
  rolling_element: 滚动体
  cage: 保持架
  tooth_flank: 齿面
  tooth_root: 齿根
  shaft: 轴
  windings: 绕组
  null: 未限定（跨多个部位或不区分部位）

damage_forms:
  # ISO 15243:2017 六大类
  rolling_contact_fatigue: 滚动接触疲劳
  wear: 磨损
  corrosion: 腐蚀
  electrical_erosion: 电蚀
  plastic_deformation: 塑性变形
  cracking_fracture: 裂纹与断裂
  # ISO 10825-1:2022 六大类（齿轮）
  tribological_damage: 摩擦学损伤
  fatigue_damage: 疲劳损伤
  non_fatigue_fracture: 非疲劳断裂
  gear_plastic_deformation: 塑性变形（齿轮）
  manufacturing_issue: 制造缺陷
  other_surface_damage: 其他表面损伤

# ---------------------------------------------------------------------------

relation_types:
  has_component:
    label: 包含部件
    domain: [equipment_class]
    range: [component]
    description: 设备类别包含哪些部件
  has_fault_mode:
    label: 具有故障模式
    domain: [component]
    range: [fault_mode]
    description: 部件可能出现的故障模式
  has_cause:
    label: 起因于
    domain: [fault_mode]
    range: [fault_cause]
    description: 导致该故障模式的因素
  indicated_by:
    label: 表现为
    domain: [fault_mode]
    range: [symptom]
    description: 该故障模式在观测上的表现
  detected_by:
    label: 可检测于
    domain: [fault_mode]
    range: [detection_method]
    description: 确认该故障模式的方法
  confused_with:
    label: 易混淆于
    domain: [fault_mode]
    range: [fault_mode]
    description: 频谱或现象上容易混淆的故障模式，对称关系
  evidenced_by:
    label: 依据于
    domain: [equipment_class, component, fault_mode, fault_cause, symptom, detection_method]
    range: [evidence]
    description: 该概念或论断的文献出处

# 边的属性约定
edge_properties:
  evidence_ids: 证据段 ID 列表，表示该条论断的出处（见 ADR-0004）
  confidence: 置信度，0–1，抽取时的模型自评
  source: 出处类型，extracted（从文献抽取）或 curated（人工整理）

