# 检索参数。改动这里等于改检索行为，提交信息里要写清依据。
#
# 向量兜底的阈值由金标准集校准（#17）：命令是 `idr calibrate --write`，
# 方法与判据见 docs/retrieval-calibration.md。不要手改数值——写回会同时更新
# 下面的 calibrated 标记，两行必须一致。
#
# 当前校准（2026-11-12，金标准 20 题：可答 18、拒答对照 2）：
#   推荐阈值 0.78。硬约束是高于最高拒答分 0.6965（R-01）；在此之上最宽的
#   稳定空档是 0.7342（F-08 的期望证据）到 0.8327（F-06 的最高分），取中点。
#   0.78 离最近观测分数 0.046，而重排分数在重复调用之间约抖动 0.01，余量
#   足够；更低的可行阈值 0.72 能多保留 F-08 的那条证据，但离拒答边界只有
#   0.014，下一次调用就可能翻面，故未采用。
#   结果：拒答对照 2/2 正确拒答；可答题的期望证据仍有 2/18 在阈值之上
#   （F-03、P-03）。代价是重排分 0.35–0.78 的候选不再进答案：跨语言相关证据
#   实测低至 0.133–0.151（P-02、X-01），而 R-01 的假阳性在 0.48–0.70，两个
#   区间重叠，单一阈值分不开；当前有意选择保守侧——宁可拒答，也不把参考
#   文献列表里的片段当依据。
#
# vector_top_k         向量召回候选数（顺序扫描取最近的 k 段证据）
# vector_min_rerank_score  重排分数低于它的候选不进答案，也是「拒答」的判据
# vector_min_rerank_score_calibrated  该阈值是否已经过金标准集校准
# vector_max_results   一次回答最多列出的证据段数
# query_enrichment     查询侧概念补全（本体规范名 + 别名 + 概念 ID 的英文词）
# query_instruction    查询侧检索指令预设（Qwen3-Embedding 的 Instruct 格式）：
#                      generic / crosslingual / 空字符串（不加）
# lexical_recall       词面召回：概念名/别名对证据原文做子串匹配，与向量名次
#                      用 RRF 融合（不用 BM25、不建索引、不复制正文）
#
# 查询改动只发生在嵌入侧，库里的向量不变，因此不需要重新嵌入语料（#20）。
# 召回诊断命令：`idr recall`（只嵌入 + pgvector，不重排）；依据见
# docs/vector-recall.md。
#
# 金标准集 48 道可答题的 recall@20/50/100（#20 实测，2026-11-12）：
#   原始问句                19/48、22/48、25/48
#   + 概念补全              21/48、28/48、38/48
#   + 检索指令（generic）   23/48、36/48、40/48
#   + 检索指令（crosslingual）27/48、34/48、36/48
#   概念补全 + crosslingual 25/48、32/48、39/48（补全拖低了 top-20，故关闭）
#   向量（crosslingual）+ 词面 RRF   33/48（top-20，生产口径）
# 结论：指令保留，概念补全关闭，词面召回开启。逐项数字与失败名次见
# docs/vector-recall.md。
query_enrichment: false
query_instruction: crosslingual
lexical_recall: true
vector_top_k: 20
vector_min_rerank_score: 0.86
vector_min_rerank_score_calibrated: true
vector_max_results: 5
